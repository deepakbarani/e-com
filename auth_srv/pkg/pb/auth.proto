
syntax = "proto3";

package auth;

option go_package = "./pkg/pb";

// Auth service with four method 
service AuthService {

  //Register
  rpc Register(RegisterRequest) returns (RegisterResponse);

  //OAuthRegister
  rpc OAuthRegister(OAuthRegisterRequest) returns (RegisterResponse);

 //Login
  rpc Login(LoginRequest) returns (LoginResponse);

  //OAuthLogin
  rpc OAuthLogin(OAuthLoginRequest) returns (LoginResponse);

}

//Request for the Register method
message RegisterRequest{
    string email = 1;
    string password = 2;
    string role = 3;
    string name = 4;
  }

//Response for the Register method
  message RegisterResponse{
    int64 status = 1;
    string error = 2;
    
  }

//Request for the Login method
  message LoginRequest{
    string email = 1;
    string password = 2;
  }

//Response for the Login method
  message  LoginResponse{
    int64 status = 1;
    string error = 2;
    string token = 3;
  }

  //Request for the OAuth Register method
  message OAuthRegisterRequest {
    string email=1;
    string userid=2;
    string role=3;
    string name=4;
    string provider=5;
  }

  //Request for the OAuth Login method
  message OAuthLoginRequest{
    string email=1;
    string userid=2;
  }

